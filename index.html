<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengumuman TKA - SMPN 3 Batam</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 900: '#0a192f', 800: '#112240' },
                        gold: { 400: '#ffd700', 500: '#d4af37' }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #0a192f;
            background-image: radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.1) 0%, transparent 20%),
                              radial-gradient(circle at 90% 80%, rgba(37, 99, 235, 0.1) 0%, transparent 20%);
        }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .trophy-icon {
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
        }
        /* Custom Scrollbar for Top Lists if needed on small screens */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05); 
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2); 
            border-radius: 10px;
        }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col items-center justify-center p-4 font-sans">

    <div class="w-full max-w-2xl"> <!-- Lebar container diperbesar sedikit untuk muat 2 kolom -->
        
        <!-- Header Dengan Logo -->
        <div class="text-center mb-6">
            <div class="inline-block p-2 rounded-full bg-white/5 border border-white/10 mb-4 shadow-lg shadow-gold-500/10 logo-container">
                <!-- Pastikan file logo.png ada di folder yang sama -->
                <img src="logo.png" alt="Logo SMPN 3 Batam" class="h-20 w-20 object-contain drop-shadow-md" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
                <i class="fas fa-school text-4xl text-gold-400 hidden"></i> <!-- Fallback icon jika logo error -->
            </div>
            
            <h1 class="text-2xl font-bold text-white tracking-wide">SMP NEGERI 3 BATAM</h1>
            <p class="text-gold-400 font-medium mt-1">Pengumuman Hasil TKA 2026</p>
        </div>

        <!-- TOP 5 PERFORMERS SECTION -->
        <div id="topPerformers" class="mb-8 grid grid-cols-1 md:grid-cols-2 gap-4 animate-fade-in-up">
            
            <!-- Top 5 Matematika -->
            <div class="glass rounded-xl p-5 border-t-4 border-blue-500 relative overflow-hidden">
                <div class="flex items-center gap-2 mb-4 border-b border-white/10 pb-2">
                    <i class="fas fa-trophy text-gold-400 trophy-icon text-xl"></i>
                    <span class="text-sm font-bold text-blue-300 uppercase tracking-wider">Top 5 Matematika</span>
                </div>
                <ul id="listMath" class="space-y-3 text-sm">
                    <!-- Data akan diisi oleh Javascript -->
                    <li class="text-center text-gray-400 py-2">Loading...</li>
                </ul>
            </div>

            <!-- Top 5 B. Indo -->
            <div class="glass rounded-xl p-5 border-t-4 border-green-500 relative overflow-hidden">
                <div class="flex items-center gap-2 mb-4 border-b border-white/10 pb-2">
                    <i class="fas fa-trophy text-gold-400 trophy-icon text-xl"></i>
                    <span class="text-sm font-bold text-green-300 uppercase tracking-wider">Top 5 B. Indonesia</span>
                </div>
                <ul id="listIndo" class="space-y-3 text-sm">
                    <!-- Data akan diisi oleh Javascript -->
                    <li class="text-center text-gray-400 py-2">Loading...</li>
                </ul>
            </div>
        </div>

        <!-- Card Pencarian -->
        <div id="searchCard" class="glass rounded-2xl p-8 shadow-2xl transition-all duration-300 max-w-md mx-auto">
            <h2 class="text-lg font-semibold mb-4 text-center text-gray-200">Cek Nilai Anda</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1 ml-1">Masukkan NISN</label>
                    <input type="number" id="inputNISN" placeholder="Contoh: 0119305692" 
                           class="w-full bg-navy-800/50 border border-navy-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-gold-400 transition-colors">
                </div>
                
                <button onclick="cariSiswa()" 
                        class="w-full bg-gradient-to-r from-gold-500 to-gold-400 hover:from-gold-400 hover:to-gold-300 text-navy-900 font-bold py-3 rounded-lg shadow-lg transform active:scale-95 transition-all">
                    <i class="fas fa-search mr-2"></i> Lihat Hasil
                </button>
            </div>

            <p id="errorMessage" class="text-red-400 text-sm text-center mt-4 hidden bg-red-400/10 py-2 rounded"></p>
        </div>

        <!-- Card Hasil -->
        <div id="resultCard" class="hidden glass rounded-2xl p-6 shadow-2xl relative overflow-hidden max-w-md mx-auto">
            <i class="fas fa-certificate absolute -right-10 -top-10 text-9xl text-white/5 rotate-12"></i>

            <div class="flex justify-between items-start mb-6 border-b border-white/10 pb-4">
                <div>
                    <h3 class="text-xl font-bold text-gold-400">Hasil Tes</h3>
                    <p class="text-xs text-gray-400 mt-1">SMP Negeri 3 Batam</p>
                </div>
            </div>

            <div class="space-y-4 mb-6">
                <div>
                    <p class="text-gray-400 text-sm">Nama Lengkap</p>
                    <p id="resNama" class="text-lg font-semibold text-white">-</p>
                </div>
                <div>
                    <p class="text-gray-400 text-sm">NISN</p>
                    <p id="resNISN" class="text-lg font-semibold text-white">-</p>
                </div>
            </div>

            <!-- Nilai dengan Deskripsi -->
            <div class="grid grid-cols-2 gap-4 mb-8">
                <!-- Matematika -->
                <div class="bg-navy-800/50 p-4 rounded-lg border border-white/5 text-center">
                    <p class="text-gray-400 text-xs uppercase tracking-wider mb-1">Matematika</p>
                    <p id="resMath" class="text-3xl font-bold text-blue-400">0</p>
                    <span id="ketMath" class="inline-block mt-2 text-[10px] px-2 py-0.5 rounded bg-gray-700 text-gray-300">-</span>
                </div>
                <!-- B. Indo -->
                <div class="bg-navy-800/50 p-4 rounded-lg border border-white/5 text-center">
                    <p class="text-gray-400 text-xs uppercase tracking-wider mb-1">B. Indonesia</p>
                    <p id="resIndo" class="text-3xl font-bold text-green-400">0</p>
                    <span id="ketIndo" class="inline-block mt-2 text-[10px] px-2 py-0.5 rounded bg-gray-700 text-gray-300">-</span>
                </div>
            </div>

            <div class="flex gap-3">
                <button onclick="downloadPDF()" class="flex-1 bg-gold-500 hover:bg-gold-400 text-navy-900 font-bold py-2 rounded-lg transition-colors flex items-center justify-center">
                    <i class="fas fa-download mr-2"></i> PDF
                </button>
                <button onclick="resetSearch()" class="flex-1 border border-white/20 hover:bg-white/10 text-white py-2 rounded-lg transition-colors">
                    <i class="fas fa-arrow-left mr-2"></i> Kembali
                </button>
            </div>
        </div>
        
        <p class="text-center text-gray-500 text-xs mt-8">© 2026 SMP Negeri 3 Batam. All rights reserved.</p>
    </div>

    <script src="data.js"></script>
    <script>
        let currentStudent = null;

        // --- LOGIKA TOP 5 PERFORMERS ---
        function loadTopPerformers() {
            if (!dataSiswa || dataSiswa.length === 0) return;

            // 1. Sort Matematika (Descending)
            const sortedMath = [...dataSiswa].sort((a, b) => b.matematika - a.matematika);
            const top5Math = sortedMath.slice(0, 5);

            // 2. Sort B. Indo (Descending)
            const sortedIndo = [...dataSiswa].sort((a, b) => b.b_indo - a.b_indo);
            const top5Indo = sortedIndo.slice(0, 5);

            // 3. Render List Matematika
            const listMathEl = document.getElementById('listMath');
            listMathEl.innerHTML = '';
            top5Math.forEach((siswa, index) => {
                let rankColor = 'text-gray-400';
                let rankIcon = `<span class="font-bold w-4">${index + 1}.</span>`;
                
                if (index === 0) { rankColor = 'text-yellow-400'; rankIcon = '<i class="fas fa-medal text-yellow-400 w-4"></i>'; }
                else if (index === 1) { rankColor = 'text-gray-300'; rankIcon = '<i class="fas fa-medal text-gray-300 w-4"></i>'; }
                else if (index === 2) { rankColor = 'text-orange-400'; rankIcon = '<i class="fas fa-medal text-orange-400 w-4"></i>'; }

                const li = document.createElement('li');
                li.className = "flex justify-between items-center bg-white/5 p-2 rounded hover:bg-white/10 transition-colors";
                li.innerHTML = `
                    <div class="flex items-center gap-2 truncate">
                        ${rankIcon}
                        <span class="truncate font-medium text-white" title="${siswa.nama}">${siswa.nama}</span>
                    </div>
                    <span class="font-bold ${rankColor} ml-2">${siswa.matematika}</span>
                `;
                listMathEl.appendChild(li);
            });

            // 4. Render List B. Indo
            const listIndoEl = document.getElementById('listIndo');
            listIndoEl.innerHTML = '';
            top5Indo.forEach((siswa, index) => {
                let rankColor = 'text-gray-400';
                let rankIcon = `<span class="font-bold w-4">${index + 1}.</span>`;
                
                if (index === 0) { rankColor = 'text-yellow-400'; rankIcon = '<i class="fas fa-medal text-yellow-400 w-4"></i>'; }
                else if (index === 1) { rankColor = 'text-gray-300'; rankIcon = '<i class="fas fa-medal text-gray-300 w-4"></i>'; }
                else if (index === 2) { rankColor = 'text-orange-400'; rankIcon = '<i class="fas fa-medal text-orange-400 w-4"></i>'; }

                const li = document.createElement('li');
                li.className = "flex justify-between items-center bg-white/5 p-2 rounded hover:bg-white/10 transition-colors";
                li.innerHTML = `
                    <div class="flex items-center gap-2 truncate">
                        ${rankIcon}
                        <span class="truncate font-medium text-white" title="${siswa.nama}">${siswa.nama}</span>
                    </div>
                    <span class="font-bold ${rankColor} ml-2">${siswa.b_indo}</span>
                `;
                listIndoEl.appendChild(li);
            });
        }

        // Jalankan saat halaman dimuat
        window.onload = loadTopPerformers;
        // -----------------------------

        function cariSiswa() {
            const input = document.getElementById('inputNISN').value.trim();
            const errorMsg = document.getElementById('errorMessage');
            
            if (!input) {
                showError("NISN wajib diisi!");
                return;
            }

            const siswa = dataSiswa.find(s => s.nisn === input);

            if (siswa) {
                currentStudent = siswa;
                tampilkanHasil(siswa);
                errorMsg.classList.add('hidden');
            } else {
                showError("Data tidak ditemukan. Periksa kembali NISN Anda.");
            }
        }

        function getBadgeClass(ket) {
            if (!ket) return 'bg-gray-700 text-gray-300';
            const k = ket.toLowerCase();
            if (k.includes('istimewa')) return 'bg-purple-500/20 text-purple-300 border border-purple-500/30';
            if (k.includes('baik')) return 'bg-green-500/20 text-green-300 border border-green-500/30';
            if (k.includes('memadai')) return 'bg-blue-500/20 text-blue-300 border border-blue-500/30';
            if (k.includes('kurang')) return 'bg-red-500/20 text-red-300 border border-red-500/30';
            return 'bg-gray-700 text-gray-300';
        }

        function tampilkanHasil(siswa) {
            document.getElementById('searchCard').classList.add('hidden');
            document.getElementById('resultCard').classList.remove('hidden');
            
            document.getElementById('resNama').innerText = siswa.nama;
            document.getElementById('resNISN').innerText = siswa.nisn;
            document.getElementById('resMath').innerText = siswa.matematika;
            document.getElementById('resIndo').innerText = siswa.b_indo;

            const badgeMath = document.getElementById('ketMath');
            const badgeIndo = document.getElementById('ketIndo');

            badgeMath.innerText = siswa.ket_mat || "-";
            badgeMath.className = `inline-block mt-2 text-[10px] px-2 py-0.5 rounded border ${getBadgeClass(siswa.ket_mat)}`;

            badgeIndo.innerText = siswa.ket_indo || "-";
            badgeIndo.className = `inline-block mt-2 text-[10px] px-2 py-0.5 rounded border ${getBadgeClass(siswa.ket_indo)}`;
        }

        function resetSearch() {
            document.getElementById('resultCard').classList.add('hidden');
            document.getElementById('searchCard').classList.remove('hidden');
            document.getElementById('inputNISN').value = '';
            currentStudent = null;
        }

        function showError(msg) {
            const el = document.getElementById('errorMessage');
            el.innerText = msg;
            el.classList.remove('hidden');
        }

        function downloadPDF() {
            if (!currentStudent) return;
            
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFontSize(18);
            doc.setTextColor(10, 25, 47);
            doc.text("SMP NEGERI 3 BATAM", 105, 20, null, null, "center");
            doc.setFontSize(14);
            doc.text("Kartu Hasil Tes Kemampuan Akademik", 105, 30, null, null, "center");
            
            doc.setLineWidth(0.5);
            doc.line(20, 35, 190, 35);

            doc.setFontSize(12);
            doc.setTextColor(0, 0, 0);
            doc.text(`Nama : ${currentStudent.nama}`, 20, 50);
            doc.text(`NISN : ${currentStudent.nisn}`, 20, 60);
            
            doc.setDrawColor(200);
            doc.setFillColor(240, 240, 240);
            doc.rect(20, 75, 170, 10, 'F');
            doc.text("Mata Pelajaran", 25, 81);
            doc.text("Nilai", 130, 81);
            doc.text("Keterangan", 155, 81); 
            
            doc.line(20, 85, 190, 85);
            doc.text("Matematika", 25, 95);
            doc.text(currentStudent.matematika.toString(), 130, 95);
            doc.text(currentStudent.ket_mat || "-", 155, 95);
            
            doc.line(20, 100, 190, 100);
            doc.text("Bahasa Indonesia", 25, 105);
            doc.text(currentStudent.b_indo.toString(), 130, 105);
            doc.text(currentStudent.ket_indo || "-", 155, 105);

            doc.setFontSize(10);
            doc.setTextColor(150);
            doc.text("Dokumen ini diterbitkan secara otomatis.", 105, 130, null, null, "center");

            doc.save(`Hasil_TKA_${currentStudent.nisn}.pdf`);
        }
    </script>
</body>
</html>
